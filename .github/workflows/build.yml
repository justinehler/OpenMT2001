name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a PR cancels that PR's running build. On main a new merge
# waits for the running build instead (one running, one pending), so every
# main build finishes and saves the dependency caches the PR builds restore.
concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.99.0
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install $RUST_VERSION --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +$RUST_VERSION fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install $RUST_VERSION --profile minimal --component clippy
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy within the warning budget
        run: .github/clippy-budget.sh +$RUST_VERSION
      # The headless runner must keep building without wgpu, winit or rodio (#99).
      - name: Check the headless runner without the native stack
        run: cargo +$RUST_VERSION check --locked -p openmt-headless

  test:
    strategy:
      fail-fast: false
      matrix:
        # Pull requests test on the OSes in the repository variable
        # PR_TEST_OSES (a JSON list) when it is set; main always tests all
        # three. It lets the macOS job leave PRs when its runners queue.
        os: ${{ fromJSON((github.event_name == 'pull_request' && vars.PR_TEST_OSES) || '["ubuntu-24.04", "windows-2025", "macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ env.RUST_VERSION }} --profile minimal
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev mesa-vulkan-drivers
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test core library (default features)
        run: cargo +${{ env.RUST_VERSION }} test --locked --lib
      - name: Build native game
        run: cargo +${{ env.RUST_VERSION }} build --locked --features native --bin game
      - name: Test library, binaries and integration tests (native, capture)
        run: cargo +${{ env.RUST_VERSION }} test --locked --features native,capture --lib --bins --tests
