name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.99.0 fmt --all -- --check
  core:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev
      - name: Test core
        run: cargo +1.99.0 test --locked --lib
      - name: Test Lua runtime
        run: cargo +1.99.0 test --locked --features lua4 --lib
      - name: Build native game
        run: cargo +1.99.0 build --locked --features native --bin game
      - name: Test native host with synthetic inputs
        run: cargo +1.99.0 test --locked --features native,capture --bin game
